# MCP servers share 6 grouped images; each service picks its server via `command`.
# Integration configs are managed via Admin UI → Integrations.
# No environment variables needed — credentials stored in MongoDB.
# mem_limit caps protect the host from one leaking/runaway server — thin HTTP
# wrappers idle at ~100MB, ml (torch + embedding model) needs headroom.
x-mcp-core: &mcp-core
  image: docker.clearfox.ai/mcp-core:${IMAGE_TAG:-latest}
  environment:
    - PORTAL_INTERNAL_AUTH_KEY
  mem_limit: 512m
  restart: on-failure

x-mcp-db: &mcp-db
  image: docker.clearfox.ai/mcp-db:${IMAGE_TAG:-latest}
  environment:
    - PORTAL_INTERNAL_AUTH_KEY
  mem_limit: 512m
  restart: on-failure

x-mcp-google: &mcp-google
  image: docker.clearfox.ai/mcp-google:${IMAGE_TAG:-latest}
  environment:
    - PORTAL_INTERNAL_AUTH_KEY
  mem_limit: 512m
  restart: on-failure

x-mcp-ml: &mcp-ml
  image: docker.clearfox.ai/mcp-ml:${IMAGE_TAG:-latest}
  environment:
    - PORTAL_INTERNAL_AUTH_KEY
  mem_limit: 2g
  restart: on-failure

services:
  portal:
    image: docker.clearfox.ai/portal:${IMAGE_TAG:-latest}
    ports:
      - "${CLEARFOX_PORT:-3000}:3000"
    environment:
      - HOSTNAME=0.0.0.0
      - PORTAL_MONGO_URI=mongodb://mongodb:27017/clearfox
      - PORTAL_SECRETS_KEY
      - PORTAL_INTERNAL_AUTH_KEY
    volumes:
      # On-disk cache for TS-native integrations (git clones, etc.).
      - integration_data:/app/integration-data
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    # Give the portal time to drain in-flight chat streams on redeploy before
    # Docker SIGKILLs it (default is 10s). Matches beginShutdown's 25s budget.
    stop_grace_period: 30s

  mongodb:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # --- core group ---
  mcp-bamboohr:
    <<: *mcp-core
    command: ["python", "bamboohr/server.py"]

  mcp-bitrix:
    <<: *mcp-core
    command: ["python", "bitrix/server.py"]

  mcp-calculator:
    <<: *mcp-core
    command: ["python", "calculator/server.py"]

  mcp-cloudflare:
    <<: *mcp-core
    command: ["python", "cloudflare/server.py"]

  mcp-confluence:
    <<: *mcp-core
    command: ["python", "confluence/server.py"]

  mcp-customer-io:
    <<: *mcp-core
    command: ["python", "customer-io/server.py"]

  mcp-datadog:
    <<: *mcp-core
    command: ["python", "datadog/server.py"]

  mcp-fetch:
    <<: *mcp-core
    command: ["python", "fetch/server.py"]

  mcp-freshservice:
    <<: *mcp-core
    command: ["python", "freshservice/server.py"]

  mcp-git:
    <<: *mcp-core
    command: ["python", "git/server.py"]
    volumes:
      - repos:/app/repos

  mcp-gitlab:
    <<: *mcp-core
    command: ["python", "gitlab/server.py"]

  mcp-google-analytics:
    <<: *mcp-core
    command: ["python", "google-analytics/server.py"]

  mcp-grafana:
    <<: *mcp-core
    command: ["python", "grafana/server.py"]

  mcp-hibob:
    <<: *mcp-core
    command: ["python", "hibob/server.py"]

  mcp-hubspot:
    <<: *mcp-core
    command: ["python", "hubspot/server.py"]

  mcp-human-input:
    <<: *mcp-core
    command: ["python", "human-input/server.py"]

  mcp-jira:
    <<: *mcp-core
    command: ["python", "jira/server.py"]

  mcp-make:
    <<: *mcp-core
    command: ["python", "make/server.py"]

  mcp-ms-calendar:
    <<: *mcp-core
    command: ["python", "ms-calendar/server.py"]

  mcp-ms-excel:
    <<: *mcp-core
    command: ["python", "ms-excel/server.py"]

  mcp-ms-files:
    <<: *mcp-core
    command: ["python", "ms-files/server.py"]

  mcp-ms-mail:
    <<: *mcp-core
    command: ["python", "ms-mail/server.py"]

  mcp-ms-teams:
    <<: *mcp-core
    command: ["python", "ms-teams/server.py"]

  mcp-notion:
    <<: *mcp-core
    command: ["python", "notion/server.py"]

  mcp-odoo:
    <<: *mcp-core
    command: ["python", "odoo/server.py"]

  mcp-rest-api:
    <<: *mcp-core
    command: ["python", "rest-api/server.py"]

  mcp-search:
    <<: *mcp-core
    command: ["python", "search/server.py"]

  mcp-sentry:
    <<: *mcp-core
    command: ["python", "sentry/server.py"]

  mcp-sequential-thinking:
    <<: *mcp-core
    command: ["python", "sequential-thinking/server.py"]

  mcp-slack:
    <<: *mcp-core
    command: ["python", "slack/server.py"]

  mcp-stripe:
    <<: *mcp-core
    command: ["python", "stripe/server.py"]

  mcp-telegram:
    <<: *mcp-core
    command: ["python", "telegram/server.py"]

  mcp-zapier:
    <<: *mcp-core
    command: ["python", "zapier/server.py"]

  # --- db group ---
  mcp-mongodb:
    <<: *mcp-db
    command: ["python", "mongodb/server.py"]

  mcp-mysql:
    <<: *mcp-db
    command: ["python", "mysql/server.py"]
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mcp-postgresql:
    <<: *mcp-db
    command: ["python", "postgresql/server.py"]
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # --- google group ---
  mcp-bigquery:
    <<: *mcp-google
    command: ["python", "bigquery/server.py"]

  mcp-gmail:
    <<: *mcp-google
    command: ["python", "gmail/server.py"]

  mcp-google-calendar:
    <<: *mcp-google
    command: ["python", "google-calendar/server.py"]

  mcp-google-docs:
    <<: *mcp-google
    command: ["python", "google-docs/server.py"]

  mcp-google-drive:
    <<: *mcp-google
    command: ["python", "google-drive/server.py"]

  mcp-google-sheets:
    <<: *mcp-google
    command: ["python", "google-sheets/server.py"]

  mcp-google-slides:
    <<: *mcp-google
    command: ["python", "google-slides/server.py"]

  # --- ml group (torch + chromadb) ---
  mcp-code:
    <<: *mcp-ml
    command: ["python", "code/mcp_server.py"]
    volumes:
      - repos:/app/repos
      - chroma_db:/app/chroma_db

  mcp-memory:
    <<: *mcp-ml
    command: ["python", "memory/server.py"]
    volumes:
      - memory_data:/app/data
    environment:
      - PORTAL_INTERNAL_AUTH_KEY
      - HF_HOME=/app/data/hf_cache

  # --- standalone images ---
  mcp-code-interpreter:
    image: docker.clearfox.ai/mcp-code-interpreter:${IMAGE_TAG:-latest}
    environment:
      - PORTAL_INTERNAL_AUTH_KEY
    mem_limit: 1g
    restart: on-failure

  mcp-presentations:
    image: docker.clearfox.ai/mcp-presentations:${IMAGE_TAG:-latest}
    environment:
      - PORTAL_INTERNAL_AUTH_KEY
    mem_limit: 1g
    restart: on-failure

  agent-scheduler:
    image: alpine:3.19
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache curl > /dev/null 2>&1
        echo "[agent-scheduler] Starting. Polling every 60s."
        trap 'exit 0' TERM INT
        while true; do
          if [ -n "$$PORTAL_INTERNAL_AUTH_KEY" ]; then
            curl -sf -H "Authorization: Bearer $$PORTAL_INTERNAL_AUTH_KEY" \
              "http://portal:3000/api/internal/agent/cron" || true
          fi
          sleep 60 &
          wait $!
        done
    environment:
      - PORTAL_INTERNAL_AUTH_KEY
    depends_on:
      portal:
        condition: service_healthy
    stop_grace_period: 3s
    restart: unless-stopped

volumes:
  repos:
  chroma_db:
  memory_data:
  integration_data:
  mongo_data:
